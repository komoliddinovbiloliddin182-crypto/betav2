<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CortenCloud — Bot Cloud Hosting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --bg2: #0a0f1a;
      --card: #101828;
      --card2: #16213a;
      --card3: #1c2a47;
      --border: #1e2940;
      --border2: #2a3a5c;
      --text: #f2f6fc;
      --muted: #8b9bb8;
      --muted2: #5d6b85;
      --primary: #3b82f6;
      --primary2: #60a5fa;
      --primary-d: #2563eb;
      --accent: #8b5cf6;
      --accent2: #a78bfa;
      --cyan: #22d3ee;
      --success: #22c55e;
      --success2: #4ade80;
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger2: #f87171;
      --admin: #f59e0b;
      --admin2: #fbbf24;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow: 0 24px 60px rgba(0,0,0,.55);
      --glow: 0 0 40px rgba(59,130,246,.18);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    ::selection { background: rgba(59,130,246,.35); }
    .hidden { display: none !important; }
    a { color: inherit; text-decoration: none; }
    code {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: rgba(59,130,246,.12); color: var(--primary2);
      padding: 2px 8px; border-radius: 6px; font-size: .85em;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 20px; border-radius: 11px; font-weight: 600; font-size: .9rem;
      border: none; cursor: pointer; text-decoration: none; transition: all .18s ease;
      font-family: inherit; white-space: nowrap; user-select: none;
    }
    .btn:active { transform: translateY(1px) scale(.99); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { color: var(--text); background: rgba(255,255,255,.06); }
    .btn-outline {
      background: rgba(255,255,255,.02); color: var(--text);
      border: 1px solid var(--border2);
    }
    .btn-outline:hover { border-color: var(--primary); background: rgba(59,130,246,.1); }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #fff; box-shadow: 0 6px 20px rgba(59,130,246,.4);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(59,130,246,.55); }
    .btn-admin {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #fff; box-shadow: 0 6px 20px rgba(245,158,11,.4);
    }
    .btn-admin:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(245,158,11,.55); }
    .btn-success { background: linear-gradient(135deg,#22c55e,#16a34a); color:#fff; box-shadow:0 6px 18px rgba(34,197,94,.35); }
    .btn-success:hover { transform: translateY(-2px); }
    .btn-danger { background: linear-gradient(135deg,#ef4444,#dc2626); color:#fff; box-shadow:0 6px 18px rgba(239,68,68,.3); }
    .btn-danger:hover { transform: translateY(-2px); }
    .btn-sm { padding: 8px 14px; font-size: .82rem; border-radius: 9px; }
    .btn-block { width: 100%; }

    /* ===== Top navigation ===== */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(5,8,15,.6);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-bottom: 1px solid transparent;
      transition: border-color .25s, background .25s;
    }
    .topnav.scrolled { border-bottom-color: var(--border); background: rgba(5,8,15,.82); }
    .brand {
      display: flex; align-items: center; gap: 11px;
      font-weight: 800; font-size: 1.2rem; letter-spacing: -.02em; color: var(--text);
    }
    .brand-icon {
      width: 38px; height: 38px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem; box-shadow: 0 6px 18px rgba(59,130,246,.4);
      position: relative; overflow: hidden;
    }
    .brand-icon.admin { background: linear-gradient(135deg, var(--admin) 0%, #d97706 100%); box-shadow: 0 6px 18px rgba(245,158,11,.4); }
    .brand-icon::after {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,.25) 50%, transparent 60%);
    }
    .nav-right { display: flex; gap: 10px; align-items: center; }

    /* ===== Language switcher ===== */
    .lang-switch {
      display: inline-flex; gap: 2px; padding: 3px;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      border-radius: 999px;
    }
    .lang-btn {
      padding: 5px 12px; border-radius: 999px; border: none; cursor: pointer;
      background: transparent; color: var(--muted); font-weight: 600; font-size: .78rem;
      font-family: inherit; transition: all .15s;
    }
    .lang-btn:hover { color: var(--text); }
    .lang-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff; box-shadow: 0 3px 10px rgba(59,130,246,.4);
    }

    /* ===== Landing ===== */
    #landing {
      min-height: 100vh; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(59,130,246,.22), transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 30%, rgba(139,92,246,.14), transparent 60%),
        radial-gradient(ellipse 40% 50% at 15% 70%, rgba(34,211,238,.08), transparent 60%),
        var(--bg);
    }
    #landing::before {
      content:''; position:absolute; inset:0; pointer-events:none; opacity:.4;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
    }
    .hero {
      position: relative; z-index: 1;
      padding: 150px 24px 90px; max-width: 1100px; margin: 0 auto; text-align: center;
    }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 16px; border-radius: 999px;
      background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.28);
      color: var(--primary2); font-size: .85rem; font-weight: 500; margin-bottom: 26px;
      backdrop-filter: blur(8px);
    }
    .hero-badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--success2);
      box-shadow: 0 0 10px var(--success2); animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .hero h1 {
      font-size: clamp(2.3rem, 6vw, 4rem); font-weight: 800;
      letter-spacing: -.035em; line-height: 1.1; margin-bottom: 22px;
    }
    .hero h1 .grad {
      background: linear-gradient(120deg, #60a5fa 0%, #a78bfa 50%, #22d3ee 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; background-size: 200% auto; animation: shimmer 5s linear infinite;
    }
    @keyframes shimmer { to { background-position: 200% center; } }
    .hero p {
      color: var(--muted); font-size: 1.15rem; max-width: 560px;
      margin: 0 auto 36px; line-height: 1.65;
    }
    .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .hero-cta .btn { padding: 15px 30px; font-size: 1.02rem; }
    .hero-stats {
      display: flex; gap: 40px; justify-content: center; flex-wrap: wrap;
      margin-top: 64px;
    }
    .hero-stat .n { font-size: 1.8rem; font-weight: 800; color: var(--text); }
    .hero-stat .n .grad { background: linear-gradient(135deg,#60a5fa,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .hero-stat .l { color: var(--muted2); font-size: .82rem; margin-top: 2px; }

    .features {
      position: relative; z-index: 1;
      max-width: 1100px; margin: 0 auto; padding: 20px 24px 100px;
    }
    .section-title { text-align: center; margin-bottom: 44px; }
    .section-title h2 { font-size: clamp(1.6rem, 3vw, 2rem); font-weight: 800; margin-bottom: 10px; letter-spacing: -.02em; }
    .section-title p { color: var(--muted); font-size: 1rem; }
    .feature-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px;
    }
    .feature {
      position: relative; background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 30px 26px; transition: all .25s; overflow: hidden;
    }
    .feature::before {
      content:''; position:absolute; top:0; left:0; right:0; height:1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,.5), transparent);
      opacity:0; transition: opacity .25s;
    }
    .feature:hover { border-color: rgba(59,130,246,.45); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,.4); }
    .feature:hover::before { opacity: 1; }
    .feature-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(139,92,246,.18));
      border: 1px solid rgba(59,130,246,.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin-bottom: 18px;
    }
    .feature h3 { font-size: 1.12rem; margin-bottom: 8px; font-weight: 700; }
    .feature p { color: var(--muted); font-size: .92rem; line-height: 1.6; }

    .pricing { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 20px 24px 100px; }
    .price-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;
      align-items: stretch;
    }
    .price-card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 34px 26px; text-align: center; position: relative; overflow: hidden;
      display: flex; flex-direction: column;
      transition: all .25s;
    }
    .price-card:hover { transform: translateY(-4px); border-color: var(--border2); }
    .price-card.popular {
      border-color: var(--primary);
      box-shadow: 0 0 0 1px var(--primary), 0 24px 50px rgba(59,130,246,.2);
      background: linear-gradient(160deg, var(--card3), var(--card));
    }
    .price-card.popular::before {
      content: attr(data-tag); position: absolute; top: 16px; right: -34px;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff;
      font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
      padding: 5px 40px; transform: rotate(45deg);
    }
    .price-card h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
    .price-card .amount {
      font-size: 2.4rem; font-weight: 800; margin: 14px 0 4px;
      background: linear-gradient(135deg, var(--primary2), var(--accent2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .price-card .unit { color: var(--muted); font-size: .88rem; margin-bottom: 22px; }
    .price-card ul { list-style: none; text-align: left; margin-bottom: 24px; flex: 1; }
    .price-card li {
      padding: 7px 0; font-size: .9rem; color: var(--muted);
      display: flex; gap: 9px; align-items: center;
    }
    .price-card li::before { content: '\2713'; color: var(--success2); font-weight: 700; }

    .footer-land {
      position: relative; z-index: 1; text-align: center; padding: 36px 24px;
      border-top: 1px solid var(--border); color: var(--muted2); font-size: .85rem;
    }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.7); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border2); border-radius: 22px;
      padding: 38px 34px; width: 100%; max-width: 460px; box-shadow: var(--shadow);
      transform: translateY(16px) scale(.98); transition: transform .28s cubic-bezier(.2,.8,.2,1);
      position: relative; max-height: 92vh; overflow-y: auto;
    }
    .modal-overlay.open .modal { transform: translateY(0) scale(1); }
    .modal h2 { font-size: 1.5rem; margin-bottom: 6px; text-align: center; font-weight: 800; }
    .modal .sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 26px; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; margin-bottom: 7px; font-size: .85rem; font-weight: 500; color: var(--muted);
    }
    .form-control {
      width: 100%; padding: 12px 15px;
      background: var(--bg); border: 1px solid var(--border2);
      border-radius: 11px; color: var(--text); font-size: .95rem;
      font-family: inherit; transition: all .15s;
    }
    .form-control:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.22); background: var(--bg2);
    }
    textarea.form-control { resize: vertical; min-height: 90px; }
    .form-error {
      color: var(--danger2); font-size: .85rem; text-align: center;
      min-height: 20px; margin-top: 12px;
    }
    .form-switch { text-align: center; margin-top: 20px; font-size: .9rem; color: var(--muted); }
    .form-switch a { color: var(--primary2); cursor: pointer; font-weight: 600; }
    .form-switch a:hover { text-decoration: underline; }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      width: 32px; height: 32px; border-radius: 9px;
      background: rgba(255,255,255,.05); border: none; color: var(--muted);
      font-size: 1.2rem; cursor: pointer; line-height: 1; transition: all .15s;
    }
    .modal-close:hover { background: rgba(255,255,255,.1); color: var(--text); }

    /* ===== App shell ===== */
    #app { display: none; min-height: 100vh; background: var(--bg); position: relative; }
    #app::before {
      content:''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 50% -5%, rgba(59,130,246,.12), transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(139,92,246,.08), transparent 60%);
    }
    #app.admin-mode::before {
      background:
        radial-gradient(ellipse 60% 40% at 50% -5%, rgba(245,158,11,.12), transparent 60%),
        radial-gradient(ellipse 40% 40% at 90% 100%, rgba(217,119,6,.08), transparent 60%);
    }
    .app-nav {
      position: sticky; top: 0; z-index: 60;
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      background: rgba(5,8,15,.8); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .app-nav.admin-nav { border-bottom-color: rgba(245,158,11,.25); }
    .app-nav-left { display: flex; align-items: center; gap: 12px; }
    .hamburger {
      width: 42px; height: 42px; border-radius: 11px; cursor: pointer;
      background: rgba(255,255,255,.04); border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      flex-direction: column; transition: all .18s;
    }
    .hamburger:hover { background: rgba(59,130,246,.12); border-color: var(--primary); }
    .hamburger span {
      display: block; width: 18px; height: 2px; border-radius: 2px;
      background: var(--text); transition: all .2s;
    }
    .app-nav-right { display: flex; align-items: center; gap: 10px; }
    .user-chip {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px 5px 5px;
    }
    .user-chip.admin-chip { border-color: rgba(245,158,11,.4); }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: .9rem; color: #fff;
    }
    .avatar.admin-av { background: linear-gradient(135deg, var(--admin), #d97706); }
    .user-chip .name { font-size: .88rem; font-weight: 600; line-height: 1.2; }
    .user-chip .bal { font-size: .75rem; color: var(--muted); line-height: 1.2; }

    /* ===== Drawer ===== */
    .drawer-bd {
      position: fixed; inset: 0; z-index: 150;
      background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .drawer-bd.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 160;
      width: 290px; max-width: 85vw;
      background: linear-gradient(180deg, var(--card), var(--bg2));
      border-right: 1px solid var(--border);
      transform: translateX(-100%); transition: transform .3s cubic-bezier(.2,.8,.2,1);
      display: flex; flex-direction: column; box-shadow: var(--shadow);
    }
    .drawer.admin-drawer { border-right-color: rgba(245,158,11,.25); }
    .drawer.open { transform: translateX(0); }
    .drawer-head {
      padding: 20px 22px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head .brand { font-size: 1.1rem; }
    .drawer-close {
      width: 34px; height: 34px; border-radius: 9px; cursor: pointer;
      background: rgba(255,255,255,.05); border: none; color: var(--muted);
      font-size: 1.3rem; line-height: 1; transition: all .15s;
    }
    .drawer-close:hover { background: rgba(255,255,255,.1); color: var(--text); }
    .drawer-nav { flex: 1; overflow-y: auto; padding: 14px 12px; }
    .drawer-nav::-webkit-scrollbar { width: 6px; }
    .drawer-nav::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .drawer-section-label {
      font-size: .68rem; text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted2); padding: 14px 14px 6px; font-weight: 700;
    }
    .drawer-item {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-radius: 11px; cursor: pointer;
      color: var(--muted); font-weight: 500; font-size: .92rem;
      transition: all .15s; margin-bottom: 3px; border: 1px solid transparent;
    }
    .drawer-item:hover { background: rgba(59,130,246,.1); color: var(--text); }
    .drawer-item.active {
      background: linear-gradient(135deg, rgba(59,130,246,.18), rgba(139,92,246,.12));
      color: var(--text); border-color: rgba(59,130,246,.3);
    }
    .drawer.admin-drawer .drawer-item:hover { background: rgba(245,158,11,.1); }
    .drawer.admin-drawer .drawer-item.active {
      background: linear-gradient(135deg, rgba(245,158,11,.2), rgba(217,119,6,.12));
      border-color: rgba(245,158,11,.35);
    }
    .drawer-item .ic { font-size: 1.15rem; width: 22px; text-align: center; }
    .drawer-item .badge-count {
      margin-left: auto; background: var(--danger); color: #fff;
      font-size: .68rem; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    }
    .drawer-item .badge-count.amber { background: var(--warning); }
    .drawer-foot { padding: 16px 14px; border-top: 1px solid var(--border); }
    .drawer-foot .lang-switch { width: 100%; justify-content: center; margin-bottom: 12px; }

    /* ===== App body ===== */
    .app-body { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 28px 20px 70px; }
    .page { display: none; }
    .page.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .welcome {
      margin-bottom: 26px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .welcome h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 4px; letter-spacing: -.02em; }
    .welcome p { color: var(--muted); font-size: .92rem; }
    .welcome .clid { color: var(--primary2); }

    .back {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--muted); font-size: .88rem; cursor: pointer;
      margin-bottom: 18px; font-weight: 600; font-family: inherit;
      background: rgba(255,255,255,.04); border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 10px; transition: all .15s;
    }
    .back:hover { color: var(--text); border-color: var(--primary); background: rgba(59,130,246,.1); transform: translateX(-2px); }
    .back .arrow { font-size: 1.05rem; }

    .card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 26px; margin-bottom: 18px;
    }
    .card.admin-card { border-color: rgba(245,158,11,.25); }
    .card h2 { font-size: 1.22rem; margin-bottom: 18px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
    .card .sub-h { font-size: 1.05rem; margin: 24px 0 14px; font-weight: 700; }

    /* ===== Stat cards ===== */
    .stat-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px; margin-bottom: 26px;
    }
    .stat-card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
      position: relative; overflow: hidden; transition: all .2s;
    }
    .stat-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .stat-card .label { color: var(--muted); font-size: .78rem; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .stat-card .label .si { font-size: .95rem; }
    .stat-card .value { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
    .stat-card .value.blue { color: var(--primary2); }
    .stat-card .value.green { color: var(--success2); }
    .stat-card .value.amber { color: var(--warning); }
    .stat-card .value.purple { color: var(--accent2); }
    .stat-card .value.red { color: var(--danger2); }

    /* ===== Quick actions ===== */
    .quick-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; margin-bottom: 26px;
    }
    .quick-card {
      background: linear-gradient(135deg, var(--card), var(--card2));
      border: 1px solid var(--border); border-radius: 14px; padding: 22px 18px;
      text-align: center; cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
    }
    .quick-card::before {
      content:''; position:absolute; inset:0; opacity:0; transition: opacity .2s;
      background: radial-gradient(circle at 50% 0%, rgba(59,130,246,.18), transparent 70%);
    }
    .quick-card:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
    .quick-card:hover::before { opacity: 1; }
    .quick-card .ic { font-size: 1.9rem; margin-bottom: 10px; }
    .quick-card .lb { font-weight: 600; font-size: .92rem; }

    /* ===== Dashboard grid ===== */
    .dash-grid {
      display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; margin-bottom: 18px;
    }
    @media (max-width: 820px) { .dash-grid { grid-template-columns: 1fr; } }

    /* ===== Activity timeline ===== */
    .timeline { display: flex; flex-direction: column; gap: 2px; }
    .tl-item {
      display: flex; gap: 13px; padding: 11px 0; border-bottom: 1px solid var(--border);
    }
    .tl-item:last-child { border-bottom: none; }
    .tl-dot {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      background: rgba(59,130,246,.12); display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .tl-body { flex: 1; min-width: 0; }
    .tl-body .txt { font-size: .88rem; }
    .tl-body .time { font-size: .74rem; color: var(--muted2); margin-top: 2px; }

    /* ===== Announcement ===== */
    .ann-item {
      padding: 13px 15px; border-radius: 12px; margin-bottom: 10px;
      background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2);
      font-size: .88rem; display: flex; gap: 10px; align-items: flex-start;
    }
    .ann-item .ai { font-size: 1.05rem; }
    .ann-item.warn { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.25); }
    .ann-item.admin-ann { background: rgba(245,158,11,.08); border-color: rgba(245,158,11,.25); }

    /* ===== Spending chart ===== */
    .chart-wrap { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 10px; }
    .chart-bar { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
    .chart-bar .bar {
      width: 100%; max-width: 38px; border-radius: 7px 7px 0 0;
      background: linear-gradient(180deg, var(--primary2), var(--primary-d));
      min-height: 3px; transition: height .4s ease; position: relative;
    }
    .chart-bar .bar.zero { background: var(--border2); }
    .chart-bar .lab { font-size: .7rem; color: var(--muted2); }
    .chart-bar .val { font-size: .68rem; color: var(--muted); }

    /* ===== Table ===== */
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { padding: 13px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,.02); }
    .badge {
      display: inline-block; padding: 3px 11px; border-radius: 999px;
      font-size: .74rem; font-weight: 600;
    }
    .badge-active { background: rgba(34,197,94,.15); color: var(--success2); }
    .badge-pending { background: rgba(245,158,11,.15); color: var(--warning); }
    .badge-off { background: rgba(239,68,68,.15); color: var(--danger2); }
    .badge-starting { background: rgba(34,211,238,.15); color: var(--cyan); }
    .badge-in { background: rgba(34,211,238,.15); color: var(--cyan); }
    .badge-out { background: rgba(239,68,68,.15); color: var(--danger2); }

    /* ===== Flash ===== */
    .flash { padding: 12px 15px; border-radius: 11px; margin-top: 14px; font-size: .9rem; display: flex; gap: 9px; align-items: center; }
    .flash-ok { background: rgba(34,197,94,.12); color: var(--success2); border: 1px solid rgba(34,197,94,.25); }
    .flash-err { background: rgba(239,68,68,.12); color: var(--danger2); border: 1px solid rgba(239,68,68,.25); }
    .flash-info { background: rgba(59,130,246,.12); color: var(--primary2); border: 1px solid rgba(59,130,246,.25); }
    .flash-warn { background: rgba(245,158,11,.12); color: var(--warning); border: 1px solid rgba(245,158,11,.25); }
    .empty { text-align: center; padding: 44px 20px; color: var(--muted); }
    .empty .ic { font-size: 2.6rem; margin-bottom: 12px; opacity: .5; }

    /* ===== Alert (inline banner) ===== */
    .alert { padding: 12px 14px; border-radius: 11px; font-size: .86rem; margin-bottom: 14px; display: flex; gap: 9px; align-items: flex-start; border: 1px solid; line-height: 1.5; }
    .alert > span:first-child { flex-shrink: 0; font-size: 1rem; line-height: 1.4; }
    .alert-info { background: rgba(59,130,246,.1); color: #93c5fd; border-color: rgba(59,130,246,.3); }
    .alert-warn { background: rgba(245,158,11,.1); color: var(--warning); border-color: rgba(245,158,11,.3); }
    .alert-ok { background: rgba(34,197,94,.1); color: var(--success2); border-color: rgba(34,197,94,.3); }

    /* ===== Tariff pick (newbot modal / customer tariffs) ===== */
    .tariff-pick { padding: 13px 15px; border: 2px solid var(--border2); border-radius: 11px; margin-bottom: 9px; cursor: pointer; transition: all .15s; display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--bg2); }
    .tariff-pick:hover { border-color: var(--primary); background: rgba(59,130,246,.06); }
    .tariff-pick.selected { border-color: var(--primary); background: rgba(59,130,246,.14); box-shadow: 0 0 0 1px var(--primary) inset; }
    .tariff-pick .tp-name { font-weight: 700; font-size: .95rem; }
    .tariff-pick .tp-meta { color: var(--muted); font-size: .76rem; margin-top: 2px; }
    .tariff-pick .tp-price { color: var(--success2); font-weight: 800; font-size: 1.05rem; white-space: nowrap; }
    .tariff-pick.disabled { opacity: .55; cursor: not-allowed; }
    .tariff-pick.disabled:hover { border-color: var(--border2); background: var(--bg2); }

    /* ===== Summary box ===== */
    .summary-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; font-size: .9rem; margin-bottom: 14px; }
    .summary-box .srow { display: flex; justify-content: space-between; padding: 5px 0; gap: 12px; }
    .summary-box .srow.total { border-top: 1px solid var(--border); margin-top: 6px; padding-top: 11px; font-weight: 700; font-size: 1rem; }

    /* ===== Customer list (admin) ===== */
    .cust-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
    .search-box { position: relative; flex: 1; max-width: 340px; }
    .search-box input { padding-left: 38px; }
    .search-box .si { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted2); font-size: .95rem; }
    .filter-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .chip { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border2); background: var(--card); cursor: pointer; font-size: .78rem; font-weight: 600; color: var(--muted); transition: all .15s; user-select: none; }
    .chip:hover { border-color: var(--primary); color: var(--primary2); }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .cust-count { color: var(--muted); font-size: .82rem; }
    .mini-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .78rem; color: #fff; flex-shrink: 0; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: rgba(59,130,246,.06); }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .info-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: .88rem; gap: 12px; }
    .info-row:last-child { border-bottom: none; }
    .info-row .k { color: var(--muted); }
    .info-row .v { font-weight: 600; text-align: right; word-break: break-all; }

    /* ===== Toast ===== */
    #cc-toast { position: fixed; bottom: 22px; right: 22px; z-index: 9999; background: var(--card2); color: var(--text); padding: 13px 20px; border-radius: 12px; border: 1px solid var(--border2); box-shadow: 0 8px 24px rgba(0,0,0,.4); font-size: .88rem; font-weight: 500; max-width: 360px; opacity: 0; transform: translateY(10px); transition: all .25s; pointer-events: none; }
    #cc-toast.show { opacity: 1; transform: translateY(0); }
    #cc-toast.ok { border-color: rgba(34,197,94,.5); }
    #cc-toast.err { border-color: rgba(239,68,68,.5); }

    /* ===== Settings ===== */
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .setting-row:last-child { border-bottom: none; }
    .setting-row .lab { font-weight: 600; font-size: .95rem; }
    .setting-row .desc { color: var(--muted); font-size: .82rem; margin-top: 2px; }
    .danger-zone { border-color: rgba(239,68,68,.3); }

    .kv { display: grid; grid-template-columns: 130px 1fr; gap: 10px 16px; align-items: center; }
    .kv .k { color: var(--muted); font-size: .88rem; }
    .kv .v { font-weight: 600; font-size: .92rem; }

    /* ===== Bot grid (mijoz) ===== */
    .bot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 14px; }
    .bot-tile {
      background: linear-gradient(160deg, var(--card2), var(--card));
      border: 1px solid var(--border); border-radius: 14px; padding: 18px;
      cursor: pointer; transition: all .2s; position: relative; overflow: hidden;
    }
    .bot-tile:hover { transform: translateY(-3px); border-color: var(--primary); box-shadow: 0 12px 28px rgba(0,0,0,.35); }
    .bot-tile .bt-head { display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
    .bot-tile .bt-ic {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display:flex; align-items:center; justify-content:center; font-size:1.2rem;
    }
    .bot-tile .bt-name { font-weight: 700; font-size: 1rem; word-break: break-word; }
    .bot-tile .bt-meta { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .bot-tile .bt-stat { margin-top: 10px; }

    .new-bot-tile {
      border: 2px dashed var(--border2); background: transparent;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height: 130px; color: var(--muted); gap: 8px;
    }
    .new-bot-tile:hover { border-color: var(--primary); color: var(--primary2); background: rgba(59,130,246,.05); }
    .new-bot-tile .plus { font-size: 2rem; }

    /* ===== Bot detail ===== */
    .bot-detail-head {
      display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom: 18px;
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px;
    }
    .bot-detail-head .bd-ic {
      width: 52px; height: 52px; border-radius: 13px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    }
    .bot-detail-head .bd-info { flex: 1; min-width: 120px; }
    .bot-detail-head .bd-name { font-size: 1.25rem; font-weight: 800; }
    .bot-detail-head .bd-sub { font-size: .82rem; color: var(--muted); margin-top: 2px; }

    .tab-bar { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom: 22px; overflow-x:auto; }
    .tab {
      padding: 12px 20px; cursor: pointer; color: var(--muted); font-weight: 600; font-size: .92rem;
      border-bottom: 2px solid transparent; white-space: nowrap; transition: all .15s; font-family: inherit;
      background: transparent; border-top: none; border-left: none; border-right: none;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--primary2); border-bottom-color: var(--primary); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; animation: fadeIn .25s ease; }

    /* ===== File drop ===== */
    .file-drop {
      border: 2px dashed var(--border2); border-radius: 14px; padding: 28px 20px;
      text-align: center; cursor: pointer; transition: all .18s; color: var(--muted);
      background: rgba(255,255,255,.015);
    }
    .file-drop:hover { border-color: var(--primary); background: rgba(59,130,246,.06); color: var(--text); }
    .file-drop .fd-ic { font-size: 2.2rem; margin-bottom: 8px; }
    .file-drop .fd-t { font-weight: 600; font-size: .95rem; }
    .file-drop .fd-s { font-size: .78rem; margin-top: 4px; }
    .file-drop input { display: none; }

    .file-list { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
    .file-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 11px;
    }
    .file-row.main { border-color: var(--success); background: rgba(34,197,94,.06); }
    .file-row .fr-ic { font-size: 1.2rem; }
    .file-row .fr-name { font-weight: 600; font-size: .9rem; word-break: break-all; flex: 1; min-width: 0; }
    .file-row .fr-size { font-size: .76rem; color: var(--muted); }
    .file-row .fr-tag {
      font-size: .68rem; padding: 2px 8px; border-radius: 999px; font-weight: 700;
      background: rgba(34,197,94,.18); color: var(--success2);
    }
    .file-row .fr-actions { display: flex; gap: 6px; }
    .mini-btn {
      padding: 6px 10px; font-size: .76rem; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--border2); background: rgba(255,255,255,.03); color: var(--muted);
      font-family: inherit; font-weight: 600; transition: all .15s;
    }
    .mini-btn:hover { color: var(--text); border-color: var(--primary); }
    .mini-btn.danger:hover { color: var(--danger2); border-color: var(--danger); }

    /* ===== Console ===== */
    .console-controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
    .console-box {
      background: #02050b; border: 1px solid var(--border); border-radius: 12px;
      padding: 16px; font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: .84rem; color: #7dd3fc; max-height: 340px; overflow-y: auto; min-height: 180px;
      line-height: 1.6;
    }
    .console-box::-webkit-scrollbar { width: 6px; }
    .console-box::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .console-line { padding: 1px 0; white-space: pre-wrap; word-break: break-word; }
    .console-line .ts { color: var(--muted2); }
    .console-line.ok { color: var(--success2); }
    .console-line.err { color: var(--danger2); }
    .console-line.warn { color: var(--warning); }
    .console-line.sys { color: var(--primary2); }

    .status-pill {
      display: inline-flex; align-items: center; gap: 7px; padding: 5px 13px;
      border-radius: 999px; font-size: .8rem; font-weight: 600;
    }
    .status-pill .sp-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-pill.on { background: rgba(34,197,94,.15); color: var(--success2); }
    .status-pill.on .sp-dot { background: var(--success2); box-shadow: 0 0 8px var(--success2); }
    .status-pill.off { background: rgba(239,68,68,.12); color: var(--danger2); }
    .status-pill.off .sp-dot { background: var(--danger2); }
    .status-pill.starting { background: rgba(34,211,238,.12); color: var(--cyan); }
    .status-pill.starting .sp-dot { background: var(--cyan); animation: pulse 1.4s infinite; }

    /* ===== Chat ===== */
    .chat-wrap { display: flex; flex-direction: column; }
    .chat {
      display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto;
      padding: 8px 4px; border: 1px solid var(--border); border-radius: 12px; background: rgba(0,0,0,.15); margin-bottom: 14px;
    }
    .chat::-webkit-scrollbar { width: 6px; }
    .chat::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    .bubble { max-width: 78%; padding: 10px 14px; border-radius: 14px; font-size: .9rem; line-height: 1.5; word-break: break-word; }
    .bubble.me { align-self: flex-end; background: linear-gradient(135deg, var(--primary), var(--primary-d)); color: #fff; border-bottom-right-radius: 4px; }
    .bubble.them { align-self: flex-start; background: var(--card3); border: 1px solid var(--border2); border-bottom-left-radius: 4px; }
    .bubble .meta { font-size: .68rem; opacity: .7; margin-top: 5px; display:flex; gap:6px; align-items:center; }
    .bubble.unread { box-shadow: 0 0 0 2px rgba(59,130,246,.4); }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row .form-control { flex: 1; }

    /* ===== Receipt ===== */
    .receipt-preview {
      max-width: 260px; max-height: 220px; border-radius: 12px; border: 1px solid var(--border2);
      margin-top: 10px; display: block;
    }
    .receipt-thumb {
      width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border2);
      cursor: pointer; transition: transform .15s;
    }
    .receipt-thumb:hover { transform: scale(1.06); }

    /* ===== Request card (admin topups) ===== */
    .req-card {
      background: linear-gradient(160deg, var(--card), var(--bg2));
      border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px;
      display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
    }
    @media (max-width: 640px){ .req-card { grid-template-columns: 1fr; } }
    .req-card .req-user { font-weight: 700; }
    .req-card .req-amt { color: var(--success2); font-weight: 800; font-size: 1.1rem; }
    .req-card .req-time { font-size: .76rem; color: var(--muted); margin-top: 2px; }
    .req-card .req-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ===== Promo manage ===== */
    .promo-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 11px; margin-bottom: 8px;
    }
    .promo-row .pr-code { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent2); }
    .promo-row .pr-amt { color: var(--success2); font-weight: 700; }
    .promo-row .pr-meta { font-size: .76rem; color: var(--muted); }

    .img-modal { max-width: 90vw; max-height: 85vh; }
    .img-modal img { width: 100%; border-radius: 12px; }

    @media (max-width: 600px) {
      .topnav { padding: 12px 16px; }
      .hero { padding: 120px 16px 60px; }
      .hero-stats { gap: 26px; margin-top: 44px; }
      .app-body { padding: 20px 14px 50px; }
      .modal { padding: 30px 22px; }
      .welcome h1 { font-size: 1.4rem; }
      .nav-right .lang-switch { display: none; }
      th, td { padding: 10px 6px; font-size: .82rem; }
      .kv { grid-template-columns: 1fr; gap: 4px; }
      .kv .k { font-size: .78rem; }
      .bot-detail-head { padding: 14px 16px; }
      .console-controls { gap: 8px; }
    }

    /* ===== Desktop: drawer becomes a persistent sidebar ===== */
    @media (min-width: 992px) {
      .hamburger { display: none; }
      .drawer-close { display: none; }
      .drawer-bd { display: none !important; }
      .drawer {
        top: 64px; transform: translateX(-100%); box-shadow: none;
        width: 248px; transition: none;
      }
      body.in-app .drawer,
      .drawer.open { transform: none; }
      .app-body { max-width: 1120px; margin-left: 248px; padding: 30px 34px 70px; }
      .app-nav { padding-left: 30px; padding-right: 30px; }
    }
    @media (min-width: 1200px) {
      .app-body { margin-left: 248px; }
    }
  </style>
</head>

<!-- ============ LANDING ============ -->
<div id="landing">
  <nav class="topnav" id="topnav">
    <a href="#" class="brand" onclick="return false">
      <div class="brand-icon">☁</div>
      CortenCloud
    </a>

const SYNC_MS = 3000;
const SHARED_W = ['card','promos','tariffs','botTemplates','notifs','broadcasts','adminLogs'];
const SHARED_ALL = ['earned'].concat(SHARED_W);
let rev = 0, dirty = false, dirtyGen = 0, pushing = false, pollBusy = false, pushTimer = null;
let snapUsers = {}, snapShared = {}, snapFiles = {}, knownReq = {};
const sleep = ms => new Promise(r => setTimeout(r, ms));

function stable(v){
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter(k => v[k] !== undefined).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
async function api(path, opts){
  opts = opts || {};
  const h = { 'Content-Type': 'application/json' };
  if (state.token) h.Authorization = 'Bearer ' + state.token;
  let r;
  try { r = await fetch(path, { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined }); }
  catch(e){ const er = new Error('network'); er.code = 'network'; throw er; }
  let j = {}; try { j = await r.json(); } catch(e){}
  if (!r.ok){ const er = new Error(j.error || ('http_' + r.status)); er.status = r.status; er.code = j.error || ('http_' + r.status); throw er; }
  return j;
}
function srvErr(e){
  const m = { nicktaken:'err_nicktaken', emailtaken:'err_emailtaken', wrong:'err_wrong', badnick:'err_nickshort', bademail:'err_email', badpass:'err_passshort', toomany:'err_wrong',
    badbotname:'err_botname', badtariff:'mb_no_tariffs', insufficient:'mb_insufficient', toomanybots:'mb_1t1b_note', toolarge:'msg_file_too_big', notfound:'err_notfound', invalid:'err_invalid',
    badtoken:'cb_badtoken', nousername:'cb_nousername', badtemplate:'cb_badtemplate', duptoken:'cb_duptoken', expired:'cb_expired' };
  if (m[e.code]) return t(m[e.code]);
  if (e.code === 'network') return 'Server bilan aloqa yo‘q. Qayta urinib ko‘ring.';
  return 'Server xatosi: ' + (e.code || '');
}

function viewSig(){
  const sh = {}; SHARED_ALL.forEach(k => { sh[k] = state[k]; });
  const u = user();
  const files = (u && u.isAdmin) ? (state.fileUploads || []).map(f => f.id + ':' + (f.read ? 1 : 0)) : [];
  return stable({ users: state.users, shared: sh, files: files });
}
function snapAll(){
  snapUsers = {}; Object.keys(state.users).forEach(k => { snapUsers[k] = JSON.stringify(state.users[k]); });
  snapShared = {}; SHARED_W.forEach(k => { snapShared[k] = JSON.stringify(state[k]); });
  snapFiles = {}; (state.fileUploads || []).forEach(f => { snapFiles[f.id] = !!f.read; });
  knownReq = {}; Object.values(state.users).forEach(u => (u.topupRequests || []).forEach(r => { knownReq[r.id] = 1; }));
}
// returns true when what the person sees has changed
function applyServer(res){
  const d = res && res.data; if (!d) return false;
  const before = viewSig();
  rev = res.rev;
  const nu = d.users || {};
  Object.keys(state.users).forEach(k => { if (!(k in nu)) delete state.users[k]; });
  Object.keys(nu).forEach(k => {
    const o = state.users[k];
    if (o){ Object.keys(o).forEach(x => { delete o[x]; }); Object.assign(o, nu[k]); }
    else state.users[k] = nu[k];
  });
  if (d.me !== undefined) state.current = d.me;
  const sh = d.shared || {};
  SHARED_ALL.forEach(k => { if (sh[k] !== undefined) state[k] = sh[k]; });
  if (sh.fileUploads) state.fileUploads = sh.fileUploads;
  else state.fileUploads = [];
  ensureAdmin();
  Object.values(state.users).forEach(ensureUserFields);
  snapAll();
  return before !== viewSig();
}
function stripReceipts(u){
  const c = Object.assign({}, u);
  c.topupRequests = (u.topupRequests || []).map(r => (knownReq[r.id] && r.receipt !== '__stripped__') ? Object.assign({}, r, { receipt: undefined }) : r);
  return c;
}
function buildPayload(){
  const me = user(); const body = {}; const deltas = {};
  if (!me.isAdmin){
    if (JSON.stringify(me) !== snapUsers[me.nick]) body.user = stripReceipts(me);
    const mine = (state.fileUploads || []).filter(f => f.nick === me.nick);
    if (mine.length) body.fileUploads = mine;
  } else {
    const us = {};
    Object.keys(state.users).forEach(k => {
      const u = state.users[k];
      if (JSON.stringify(u) !== snapUsers[k]){ us[k] = stripReceipts(u); if (u._dBal) deltas[k] = u._dBal; }
    });
    if (Object.keys(us).length) body.users = us;
    const sh = {};
    SHARED_W.forEach(k => { if (JSON.stringify(state[k]) !== snapShared[k]) sh[k] = state[k]; });
    if (Object.keys(sh).length) body.shared = sh;
    const rf = (state.fileUploads || []).filter(f => f.read && snapFiles[f.id] === false).map(f => f.id);
    if (rf.length) body.readFiles = rf;
  }
  return { body: body, deltas: deltas };
}
function save(){
  dirty = true; dirtyGen++;
  saveLocal();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 300);
}
async function push(){
  if (pushing || !state.token) return;
  if (!user()){ dirty = false; return; }
  const gen = dirtyGen;
  const pl = buildPayload();
  if (!Object.keys(pl.body).length){ dirty = false; return; }
  pushing = true;
  Object.keys(pl.deltas).forEach(k => { if (state.users[k]) delete state.users[k]._dBal; });
  let retry = 0;
  try {
    const res = await api('/api/sync', { method: 'PUT', body: pl.body });
    if (dirtyGen === gen){ dirty = false; if (applyServer(res)) rerender(); }
    else retry = 100;
  } catch(e){
    Object.keys(pl.deltas).forEach(k => { if (state.users[k]) state.users[k]._dBal = (state.users[k]._dBal || 0) + pl.deltas[k]; });
    if (e.status === 401){ pushing = false; forceLogout(); return; }
    retry = 3000;
  }
  pushing = false;
  if (retry){ clearTimeout(pushTimer); pushTimer = setTimeout(push, retry); }
}
async function flush(){
  clearTimeout(pushTimer);
  for (let i = 0; i < 40 && (pushing || dirty); i++){
    if (!pushing) await push();
    await sleep(60);
  }
}
async function poll(){
  if (!state.token || !user() || pushing || dirty || pollBusy) return;
  pollBusy = true;
  try {
    const res = await api('/api/sync?rev=' + rev);
    if (!dirty && !pushing && res.changed !== false){ if (applyServer(res)) rerender(); }
  } catch(e){ if (e.status === 401) forceLogout(); }
  pollBusy = false;
}
setInterval(poll, SYNC_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

/* compress image to dataURL to keep localStorage small */
function compressImage(file, cb, maxW){
  maxW = maxW || 900;
  if (!file || !file.type.startsWith('image/')){ cb(null); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / Math.max(1, img.width));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try { cb(canvas.toDataURL('image/jpeg', 0.55)); }
      catch { cb(e.target.result); }
    };
    img.onerror = ()=> cb(null);
    img.src = e.target.result;
  };
  reader.onerror = ()=> cb(null);
  reader.readAsDataURL(file);
}
function fmtBytes(n){
  if (!n) return '0 B';
  const u = ['B','KB','MB','GB'];
  let i = 0; while(n >= 1024 && i < u.length-1){ n/=1024; i++; }
  return (n>=10 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i];
}

async function doRegister(){
  const nick = document.getElementById('reg-nick').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const pass = document.getElementById('reg-pass').value;
  const pass2 = document.getElementById('reg-pass2').value;
  const err = document.getElementById('reg-err');
  err.textContent = '';
  if (!nick || nick.length < 3) { err.textContent = t('err_nickshort'); return; }
  if (!email || !email.includes('@')) { err.textContent = t('err_email'); return; }
  if (pass.length < 6) { err.textContent = t('err_passshort'); return; }
  if (pass !== pass2) { err.textContent = t('err_passmatch'); return; }
  if (nick.toLowerCase() === 'admin') { err.textContent = t('err_nicktaken'); return; }
  try {
    const res = await api('/api/register', { method: 'POST', body: { nick: nick, email: email, pass: pass } });
    state.token = res.token; saveLocal();
    applyServer(res);
    closeModals();
    enterApp();
  } catch(e){ err.textContent = srvErr(e); }
}

async function doLogin(){
  const nick = document.getElementById('login-nick').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err');
  err.textContent = '';
  if (!nick || !pass) { err.textContent = t('err_empty'); return; }
  try {
    const res = await api('/api/login', { method: 'POST', body: { nick: nick, pass: pass } });
    state.token = res.token; saveLocal();
    applyServer(res);
    const u = user();
    ensureUserFields(u);
    addActivity(u, 'act_login');
    if (u.isAdmin) addAdminLog('alog_login');
    save();
    closeModals();
    enterApp();
  } catch(e){ err.textContent = srvErr(e); }
}

function renderCBots(){

function cbSelectTemplate(id){

function cbShowMsg(type, msg){ const el = document.getElementById('cb-msg'); el.className = 'flash flash-'+type; el.textContent = msg; el.style.display = 'block'; }
function cbLaunch(btn){
  const u = user();
  if (!cbSelectedTemplate){ cbShowMsg('err', t('cb_badtemplate')); return; }
  const token = (document.getElementById('cb-token').value || '').trim();
  if (!/^\d+:[A-Za-z0-9_-]{20,}$/.test(token)){ cbShowMsg('err', t('cb_badtoken')); return; }
  const orig = btn ? btn.textContent : '🚀'; if (btn){ btn.disabled = true; btn.textContent = '⏳...'; }
  api('/api/cb-create', { method:'POST', body:{ name: 'CortenBot', templateId: cbSelectedTemplate, token } })

    .catch(e => { cbShowMsg('err', '❌ '+srvErr(e)); })

}
function renderCBMyBots(){
  const u = user();
  const box = document.getElementById('cb-bots'); if (!box) return;

  const now = Date.now();
  box.innerHTML = bots.map(b=>{
    let st = b.status || 'off';
    if (b.expiresAt && Number(b.expiresAt) < now) st = 'expired';
    const daysLeft = b.expiresAt ? Math.max(0, Math.ceil((Number(b.expiresAt)-now)/86400000)) : 0;
    const stLbl = st==='on' ? t('cb_status_on') : (st==='off' ? t('cb_status_off') : t('cb_status_expired'));
    const stCls = st==='on' ? 'badge-active' : (st==='expired' ? 'badge-off' : 'badge-pending');
    const toggleBtn = st==='expired' ? '' : '<button class="mini-btn" onclick="cbToggle(\''+esc(b.id)+'\')">'+(st==='on'?t('cb_off'):t('cb_on'))+'</button>';
    return '<div class="req-card" style="align-items:center">'+
      '<div><div class="req-user">'+esc(b.templateIcon||'🤖')+' '+esc(b.name)+' <span class="muted">@'+esc(b.tgUsername||'')+'</span></div>'+
      '<div class="req-amt">'+esc(b.templateName)+(b.isTrial?' · 🎁 '+t('cb_trial_badge'):'')+' · '+tf('cb_days_left',{n:daysLeft})+'</div></div>'+
      '<div class="req-actions"><span class="badge '+stCls+'">'+stLbl+'</span>'+toggleBtn+
      '<button class="mini-btn danger" onclick="cbDelete(\''+esc(b.id)+'\')">'+t('cb_delete')+'</button></div></div>';
  }).join('');
}
function cbToggle(botId){
  api('/api/cb-toggle', { method:'POST', body:{ botId } })

function adminAddBotTemplate(){
  const name = (document.getElementById('acbtpl-name').value||'').trim();
  const icon = (document.getElementById('acbtpl-icon').value||'').trim() || '🤖';
  const price = parseInt(document.getElementById('acbtpl-price').value, 10);

  const desc = (document.getElementById('acbtpl-desc').value||'').trim();

  if (!name || isNaN(price) || price < 0){ msg.innerHTML = '<div class="flash flash-err">⚠ '+t('cust_invalid_bal')+'</div>'; return; }
  const list = (state.botTemplates||[]).slice();
  list.push({ id: uid(), name, icon, desc, price, days, active: true, createdAt: Date.now() });

function adminSaveBotTemplate(id){
  const priceEl = document.getElementById('acbtpl-price-'+id); const daysEl = document.getElementById('acbtpl-days-'+id);
  if (!priceEl) return;

  const list = (state.botTemplates||[]).map(tf => String(tf.id)===String(id) ? Object.assign({}, tf, { price, days }) : tf);

function adminDeleteBotTemplate(id){

  saveBotTemplates(list, document.getElementById('acbtpl-msg'));

    .then(res => { applyServer(res); renderABotTemplates(); renderDrawer(); if (msgEl) msgEl.innerHTML = '<div class="flash flash-ok">✓ '+t('acbtpl_saved')+'</div>'; })

function showPage(name){
  const u = user(); if (!u) return;
  // guard: customers cannot open admin pages and vice versa
  if (u.isAdmin && CUST_PAGES.includes(name) && name!=='dash') name = 'adash';
  if (!u.isAdmin && ADMIN_PAGES.includes(name)) name = 'dash';
  currentPage = name;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  if (el) el.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  closeDrawer();

  if (r) r();
  updateNav();
}

function badgeFor(status){

}

function renderChart(){
  const now = new Date();
  const months = [];
  for (let i=5; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({ ym: d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), label: d.toLocaleString(curLang==='uz'?'uz-UZ':curLang==='ru'?'ru-RU':'en-GB',{month:'short'}), sum:0 });
  }
  const u = user();
  u.transactions.forEach(tx => {
    if (tx.type !== 'out') return;
    const d = new Date(tx.time);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    const m = months.find(x => x.ym === ym);
    if (m) m.sum += tx.amount;
  });
  const max = Math.max(1, ...months.map(m => m.sum));
  document.getElementById('dash-chart').innerHTML = months.map(m =>
    '<div class="chart-bar"><div class="val">'+(m.sum? fmtMoney(m.sum):'')+'</div>'+
    '<div class="bar'+(m.sum?'':' zero')+'" style="height:'+(m.sum? Math.max(6, (m.sum/max)*130) : 4)+'px"></div>'+
    '<div class="lab">'+m.label+'</div></div>'
  ).join('');
}

function doTopupRequest(){

  if (!pendingReceipt){

  const req = { id: uid(), amount, receipt: pendingReceipt, status:'pending', time: Date.now() };

function doCreateBot(){
  const u = user();
  const name = document.getElementById('newbot-name').value.trim();
  const err = document.getElementById('newbot-err');
  err.textContent = '';
  const list = activeTariffs();
  if (!list.length){ err.textContent = t('mb_no_tariffs'); return; }
  if (!newbotSelectedTariff){ err.textContent = t('mb_pick_first'); return; }
  if (!name || name.length < 2){ err.textContent = t('err_botname'); return; }
  if (u.balance < newbotSelectedTariff.price){ err.textContent = t('mb_insufficient'); return; }
  const btn = document.querySelector('#modal-newbot .btn-primary');
  if (btn){ btn.disabled = true; btn.textContent = t('mb_creating'); }
  api('/api/create-bot', { method: 'POST', body: { name: name, tariffId: newbotSelectedTariff.id } })
    .then(res => {
      applyServer(res);
      // find the freshly-created bot (by id if server returned it, else last)
      let idx = res.botId ? Math.max(0, u.bots.findIndex(b => b.id === res.botId)) : u.bots.length - 1;
      if (idx < 0) idx = u.bots.length - 1;

function readFileAsDataURL(file){
  return new Promise((resolve)=>{
    if (file.size > 1048576){ resolve({ tooBig:true }); return; } // 1 MB cap
    const r = new FileReader();
    r.onload = e => resolve({ dataUrl: e.target.result, mime: file.type });
    r.onerror = ()=> resolve({ tooBig:true });
    r.readAsDataURL(file);
  });
}
async function doAddBotFiles(files){
  const u = user();
  const b = curBot(); if (!b) return;
  const box = document.getElementById('botfile-msg');
  if (!files.length){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_file_need')+'</div>'; return; }
  box.innerHTML = '<div class="flash flash-info">⏳ '+t('msg_file_reading')+'</div>';
  let added = [], bigSkipped = [];
  for (const f of files){
    if ((b.files||[]).some(x=>x.name===f.name)) continue;
    const rd = await readFileAsDataURL(f);
    b.files.push({ name: f.name, size: f.size });
    added.push(f.name);
    // forward the ACTUAL FILE (not just the name) to admin
    state.fileUploads.unshift({
      id: uid(), nick: u.nick, clientId: u.clientId, botId: b.id, botName: b.name,
      fileName: f.name, fileSize: f.size, mime: f.type,
      dataUrl: rd.dataUrl || null, tooBig: !!rd.tooBig,
      time: Date.now(), read:false
    });
    if (rd.tooBig) bigSkipped.push(f.name);
    addActivity(u, 'act_file_add', { file: f.name, bot: b.name });
    botLog(b, 'File added & forwarded to admin: ' + f.name, 'sys');
  }
  if (added.length){
    save();
    renderBotDetail();
    let msg = '<div class="flash flash-ok">✓ '+t('msg_file_added')+esc(added.join(', '))+'</div>';
    if (bigSkipped.length) msg += '<div class="flash flash-warn">⚠ '+t('msg_file_too_big')+': '+esc(bigSkipped.join(', '))+'</div>';
    const box2 = document.getElementById('botfile-msg'); if (box2) box2.innerHTML = msg;
  } else {
    const box2 = document.getElementById('botfile-msg'); if (box2) box2.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_file_need')+'</div>';
  }
}

  renderATariffs();
  renderLandingTariffs();
}

function editCustomerBalance(nick){
  const u = state.users[nick]; if (!u) return;
  const v = prompt(t('cust_new_bal'), String(u.balance || 0));
  if (v === null) return;
  const num = parseInt(String(v).replace(/\D/g,''), 10);
  if (isNaN(num) || num < 0){ toast(t('cust_invalid_bal'), 'err'); return; }
  const delta = num - (u.balance || 0);
  if (delta === 0){ closeGenericModal(); return; }
  // apply via admin sync: send _dBal delta for that user
  const payload = { users: {} };
  payload.users[nick] = { _dBal: delta };
  api('/api/sync', { method: 'PUT', body: payload })
    .then(res => {
      applyServer(res);
      toast(t('cust_bal_updated'), 'ok');
      closeGenericModal();
      renderAUsers();
      renderDrawer();
    })
    .catch(e => { toast(srvErr(e) || t('cust_invalid_bal'), 'err'); });
}

function adminBotStatus(nick, idx, status){
  // admin sets a customer's bot status via /api/sync (admin merge allows bot status updates)
  const payload = { users: {} };
  payload.users[nick] = { bots: [] };
  // we must send the bot with the new status matched by id; build a minimal stub
  const u = state.users[nick];
  if (!u || !u.bots[idx]) return;
  payload.users[nick].bots = [{ id: u.bots[idx].id, status: status }];
  api('/api/sync', { method: 'PUT', body: payload })
    .then(res => {
      applyServer(res);
      toast(status==='active' ? t('a_bot_approved') : t('msg_bot_stopped'), 'ok');
      renderABots(); renderDrawer();
    })
    .catch(e => { toast(srvErr(e), 'err'); });
}

/* ============================================================
   ADMIN: TOPUPS (approve with receipt)
   ============================================================ */
function renderATopups(){
  const box = document.getElementById('atopups-box');
  const users = Object.values(state.users).filter(u=>!u.isAdmin);
  const reqs = [];
  users.forEach(u => (u.topupRequests||[]).forEach(r => reqs.push({ nick:u.nick, req:r }) ));
  const pending = reqs.filter(x=>x.req.status==='pending');
  const history = reqs.filter(x=>x.req.status!=='pending').slice().reverse().slice(0,10);
  let html = '';
  if (!pending.length){
    html += '<div class="empty"><div class="ic">✅</div><p>'+t('a_no_topups')+'</p></div>';
  } else {
    html += pending.map(x=>{
      const r = x.req;
      const receipt = (r.receipt && r.receipt!=='__stripped__')
        ? '<img class="receipt-thumb" src="'+r.receipt+'" onclick="viewImage(\''+r.receipt.replace(/'/g,"\\'")+'\')" alt="receipt">'
        : '<span style="color:var(--muted2);font-size:.8rem">—</span>';
      return '<div class="req-card">'+
        '<div>'+receipt+'</div>'+
        '<div><div class="req-user">'+esc(x.nick)+'</div><div class="req-amt">'+fmtMoney(r.amount)+' '+t('som')+'</div><div class="req-time">'+fmtTime(r.time)+'</div></div>'+
        '<div class="req-actions"><button class="btn btn-success btn-sm" onclick="approveTopup(\''+esc(x.nick)+'\',\''+r.id+'\')">'+t('msg_approve')+'</button>'+
        '<button class="btn btn-danger btn-sm" onclick="rejectTopup(\''+esc(x.nick)+'\',\''+r.id+'\')">'+t('msg_reject')+'</button></div>'+
      '</div>';
    }).join('');
  }
  if (history.length){
    html += '<div class="sub-h">📜 '+t('a_bc_history').replace('Xabar','So\'rovlar')+'</div>';
    const clsMap = { approved:'badge-active', rejected:'badge-off' };
    const labMap = { approved:t('msg_topup_approved'), rejected:t('msg_topup_rejected') };
    html += history.map(x=>'<div class="ann-item"><span class="ai">🧾</span><span><b>'+esc(x.nick)+'</b> — '+fmtMoney(x.req.amount)+' '+t('som')+' · <span class="badge '+clsMap[x.req.status]+'">'+labMap[x.req.status]+'</span> · '+fmtTime(x.req.time)+'</span></div>').join('');
  }
  box.innerHTML = html;
  renderDrawer();
}
function approveTopup(nick, reqId){
  const u = state.users[nick]; if (!u) return;
  const r = (u.topupRequests||[]).find(x=>x.id===reqId); if (!r) return;
  if (r.status !== 'pending') return;
  r.status = 'approved';
  u.balance += r.amount;
  state.earned = (state.earned||0) + r.amount;
  addTx(u, 'in', r.amount, 'tx_topup');
  addActivity(u, 'act_topup', { amount: fmtMoney(r.amount) });
  addAdminLog('alog_topup_app', { nick, amount: fmtMoney(r.amount) });
  save();
  renderATopups();
}
function rejectTopup(nick, reqId){
  const u = state.users[nick]; if (!u) return;
  const r = (u.topupRequests||[]).find(x=>x.id===reqId); if (!r) return;
  if (r.status !== 'pending') return;
  r.status = 'rejected';
  r.receipt = '__stripped__'; // free space
  addAdminLog('alog_topup_rej', { nick });
  save();
  renderATopups();
}

/* ============================================================
   ADMIN: BALANCE MANAGE (add/sub)
   ============================================================ */
function renderABalance(){
  const users = Object.values(state.users).filter(u=>!u.isAdmin);
  const sel = document.getElementById('abal-user');
  sel.innerHTML = '<option value="">'+t('a_bal_user')+'</option>' +
    users.map(u=>'<option value="'+esc(u.nick)+'">'+esc(u.nick)+' — '+fmtMoney(u.balance)+' '+t('som')+'</option>').join('');
  document.getElementById('abal-amt').value = '';
  document.getElementById('abal-msg').innerHTML = '';
}
function adminBal(action){
  const nick = document.getElementById('abal-user').value;
  const amount = parseInt(document.getElementById('abal-amt').value, 10);
  const box = document.getElementById('abal-msg');
  if (!nick){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_bal_nouser')+'</div>'; return; }
  if (!amount || amount <= 0){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_topup_min')+'</div>'; return; }
  const u = state.users[nick];
  if (action === 'add'){
    u.balance += amount; u._dBal = (u._dBal||0) + amount;
    state.earned = (state.earned||0) + amount;
    addTx(u, 'in', amount, 'tx_admin_add');
    addActivity(u, 'act_topup', { amount: fmtMoney(amount) });
    addAdminLog('alog_baladd', { nick, amount: fmtMoney(amount) });
    box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_bal_added')+': +'+fmtMoney(amount)+' '+t('som')+'</div>';
  } else {
    if (u.balance < amount){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_bal_nouser')+'</div>'; return; }
    u.balance -= amount; u._dBal = (u._dBal||0) - amount;
    state.earned = Math.max(0, (state.earned||0) - amount);
    addTx(u, 'out', amount, 'tx_admin_sub');
    addAdminLog('alog_balsub', { nick, amount: fmtMoney(amount) });
    box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_bal_subbed')+': −'+fmtMoney(amount)+' '+t('som')+'</div>';
  }
  save();
  renderABalance();
  renderDrawer();
}

/* ============================================================
   ADMIN: PROMOS (create / list / delete)
   ============================================================ */
function renderAPromos(){
  document.getElementById('apromo-code').value = '';
  document.getElementById('apromo-amount').value = '';
  document.getElementById('apromo-msg').innerHTML = '';
  const box = document.getElementById('apromo-list');
  const codes = Object.keys(state.promos||{});
  if (!codes.length){ box.innerHTML = '<p style="color:var(--muted);font-size:.9rem">'+t('a_no_data')+'</p>'; return; }
  box.innerHTML = codes.map(code=>
    '<div class="promo-row"><span class="pr-code">'+code+'</span><span class="pr-amt">+'+fmtMoney(state.promos[code])+' '+t('som')+'</span>'+
    '<span class="pr-meta">'+t('a_promo_amount')+'</span>'+
    '<button class="mini-btn danger" onclick="adminDeletePromo(\''+code+'\')">✕</button></div>'
  ).join('');
}
function adminCreatePromo(){
  const code = document.getElementById('apromo-code').value.trim().toUpperCase();
  const amount = parseInt(document.getElementById('apromo-amount').value, 10);
  const box = document.getElementById('apromo-msg');
  if (!code || code.length < 3){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('err_nickshort')+'</div>'; return; }
  if (!amount || amount < 100){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_topup_min')+'</div>'; return; }
  if (state.promos[code]){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_promo_exists')+'</div>'; return; }
  state.promos[code] = amount;
  addAdminLog('alog_promo', { code, amount: fmtMoney(amount) });
  save();
  renderAPromos();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_promo_created')+code+' (+'+fmtMoney(amount)+' '+t('som')+')</div>';
}
function adminDeletePromo(code){
  if (!confirm(code+' ?')) return;
  delete state.promos[code];
  addAdminLog('alog_promo_del', { code });
  save();
  renderAPromos();
}

/* ============================================================
   ADMIN: BROADCAST (send to all)
   ============================================================ */
function renderABroadcast(){
  document.getElementById('bc-text').value = '';
  document.getElementById('bc-msg').innerHTML = '';
  const box = document.getElementById('bc-history');
  const list = (state.broadcasts||[]).slice().reverse();
  if (!list.length){ box.innerHTML = '<p style="color:var(--muted);font-size:.9rem">'+t('a_no_bc')+'</p>'; return; }
  box.innerHTML = list.map(b=>'<div class="ann-item admin-ann"><span class="ai">📢</span><span>'+esc(b.text)+'<div class="req-time" style="margin-top:4px">'+fmtTime(b.time)+'</div></span></div>').join('');
}
function adminBroadcast(){
  const text = document.getElementById('bc-text').value.trim();
  const box = document.getElementById('bc-msg');
  if (!text){ box.innerHTML = '<div class="flash flash-err">⚠ '+t('msg_bc_empty')+'</div>'; return; }
  const id = 'bc_' + Date.now();
  state.broadcasts.push({ id, text, time: Date.now() });
  // add to global notifs so everyone sees it
  state.notifs.unshift({ id, icon:'📢', kind:'info', text, isBroadcast:true });
  // reset each user's read state for this broadcast
  Object.values(state.users).forEach(u=>{ if (!u.isAdmin){ u.readNotifs = (u.readNotifs||[]).filter(x=>x!==id); } });
  addAdminLog('alog_bc');
  save();
  renderABroadcast();
  box.innerHTML = '<div class="flash flash-ok">✓ '+t('msg_bc_sent')+'</div>';
}

/* ============================================================
   ADMIN: CHAT (read & reply)
   ============================================================ */
function renderAChat(){
  const users = Object.values(state.users).filter(u=>!u.isAdmin)
    .filter(u => (u.messages||[]).length > 0);
  const sel = document.getElementById('achat-user');
  const prev = sel.value || '';
  sel.innerHTML = '<option value="">'+t('a_chat_user')+'</option>' +
    users.map(u=>{
      const unread = (u.messages||[]).filter(m=>m.from==='user' && !m.read).length;
      const selAttr = (prev === u.nick) ? ' selected' : '';
      return '<option value="'+esc(u.nick)+'"'+selAttr+'>'+esc(u.nick)+(unread?' ('+unread+')':'')+'</option>';
    }).join('');
  if (prev && state.users[prev] && users.some(u=>u.nick===prev)) sel.value = prev;
  renderAChatConv();
}
function renderAChatConv(){
  const sel = document.getElementById('achat-user');
  const box = document.getElementById('achat-box');
  const nick = sel.value;
  if (!nick || !state.users[nick]){ box.innerHTML = '<p style="color:var(--muted);font-size:.9rem">'+t('a_chat_empty')+'</p>'; renderDrawer(); return; }
  const u = state.users[nick];
  let changed = false;
  (u.messages||[]).forEach(m=>{ if (m.from==='user' && !m.read){ m.read=true; changed=true; } });
  if (changed) save();
  let html = '<div class="chat" id="achat-list">'+
    (u.messages.length ? u.messages.map(m=>{
      const me = m.from==='admin';
      const cls = me ? 'me' : 'them';
      const who = me ? t('admin_lbl') : t('you');
      return '<div class="bubble '+cls+'">'+esc(m.text)+'<div class="meta">'+who+' · '+fmtTime(m.time)+'</div></div>';
    }).join('') : '<p style="color:var(--muted);padding:14px">'+t('a_no_msgs')+'</p>')+'</div>';
  html += '<div class="chat-input-row"><input class="form-control" id="achat-reply" data-i18n-ph="p_contact_ph" placeholder="'+esc(t('p_contact_ph'))+'" onkeydown="if(event.key===\'Enter\')adminReply(\''+esc(nick)+'\')">'+
    '<button class="btn btn-admin" style="width:auto" onclick="adminReply(\''+esc(nick)+'\')">'+t('p_contact_send')+'</button></div>';
  const oldIn = document.getElementById('achat-reply');
  const keepVal = (oldIn && window._achatNick === nick) ? oldIn.value : '';
  const hadFocus = !!oldIn && document.activeElement === oldIn;
  window._achatNick = nick;
  box.innerHTML = html;
  const newIn = document.getElementById('achat-reply');
  if (newIn && keepVal) newIn.value = keepVal;
  if (newIn && hadFocus) newIn.focus();
  const list = document.getElementById('achat-list');
  if (list) list.scrollTop = list.scrollHeight;
  renderDrawer();
}
function adminReply(nick){
  const u = state.users[nick]; if (!u) return;
  const inp = document.getElementById('achat-reply');
  const text = (inp.value||'').trim();
  if (!text) return;
  u.messages.push({ from:'admin', text, time: Date.now(), read:false });
  addAdminLog('alog_chat', { nick });
  save();
  renderAChat();
}

/* ============================================================
   ADMIN: LOGS
   ============================================================ */
function renderALogs(){
  const box = document.getElementById('alogs-box');
  const logs = state.adminLogs || [];
  if (!logs.length){ box.innerHTML = '<div class="empty"><div class="ic">📜</div><p>'+t('a_no_logs')+'</p></div>'; return; }
  box.innerHTML = '<div class="timeline">'+ logs.map(a =>
    '<div class="tl-item"><div class="tl-dot">▪</div><div class="tl-body"><div class="txt">'+esc(tf(a.key, a.params))+'</div><div class="time">'+fmtTime(a.time)+'</div></div></div>'
  ).join('') + '</div>';
}

/* ============================================================
   ADMIN: SETTINGS
   ============================================================ */
function renderASettings(){
  document.getElementById('ad-card').value = state.card;
  document.getElementById('ad-msg').innerHTML = '';
}
function saveCard(){
  state.card = document.getElementById('ad-card').value.trim() || state.card;
  save();
  document.getElementById('ad-msg').innerHTML = '<div class="flash flash-ok">✓ '+t('msg_card_saved')+'</div>';
}

/* ============================================================
   INIT
   ============================================================ */
document.getElementById('login-pass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('reg-pass2').addEventListener('keypress', e => { if (e.key === 'Enter') doRegister(); });
document.getElementById('newbot-name').addEventListener('keypress', e => { if (e.key === 'Enter') doCreateBot(); });
window.addEventListener('scroll', () => {
  const tn = document.getElementById('topnav'); if (tn) tn.classList.toggle('scrolled', window.scrollY > 20);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeModals(); closeDrawer(); } });

applyI18n();
(async function boot(){
  try {
    const res = await api('/api/sync');
    applyServer(res);
    if (state.token && res.data && res.data.me){ enterApp(); }
    else { renderLandingTariffs(); }
  } catch(e){
    if (e.status === 401){
      state.token = null; saveLocal();
      loadPublic();
    }
  }
})();
</script>
